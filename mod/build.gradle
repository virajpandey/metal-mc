plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"metalmc_bench" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Local dedicated server for multiplayer LOD tests (offline mode; set up by tools/mpserver_setup.py).
		server {
			runDir "run-server"
			programArgs "--nogui"
		}
		// ./gradlew runClient -PbenchLabel=opengl  (graphics backend itself is set in run/options.txt)
		client {
			// -PmpServer=localhost:25565 joins a server (the local test server: ./gradlew runServer) instead.
			if (project.hasProperty("mpServer")) {
				programArgs "--quickPlayMultiplayer", project.findProperty("mpServer").toString(), "--username", "MetalMCBench"
			} else {
				programArgs "--quickPlaySingleplayer", "claudeworld", "--username", "MetalMCBench"
			}
			property "metalmc.bench", "1"
			property "metalmc.bench.label", (project.findProperty("benchLabel") ?: "unlabeled").toString()
			property "metalmc.bench.y", (project.findProperty("benchY") ?: "150").toString()
			property "metalmc.bench.gpuTimer", (project.findProperty("benchGpu") ?: "0").toString()
			// ./gradlew runClient -PmetalBackend=metal  tries the MetalMC backend first (falls back if it declines)
			// -PmetalBackend=config uses config/metalmc.properties (the release behavior).
			if ((project.findProperty("metalBackend") ?: "off").toString() != "config") {
				property "metalmc.backend", (project.findProperty("metalBackend") ?: "off").toString()
			}
			// -PbundledNative=1 tests the release path: the dylib is extracted from the mod's resources.
			if (!project.hasProperty("bundledNative")) {
				property "metalmc.native", file("../.build/release/libMetalMCNative.dylib").absolutePath
			}
			property "metalmc.backend.presentTest", (project.findProperty("presentTest") ?: "0").toString()
			property "metalmc.bench.warmupTicks", (project.findProperty("benchWarmup") ?: "400").toString()
			property "metalmc.bench.cx", (project.findProperty("benchCx") ?: "8").toString()
			property "metalmc.bench.cz", (project.findProperty("benchCz") ?: "8").toString()
			property "metalmc.bench.noon", (project.findProperty("benchNoon") ?: "0").toString()
			property "metalmc.bench.trace", (project.findProperty("benchTrace") ?: "0").toString()
			property "metalmc.facingCulling", (project.findProperty("facingCulling") ?: "1").toString()
			property "metalmc.occlusionCulling", (project.findProperty("occlusionCulling") ?: "1").toString()
			property "metalmc.pregen", (project.findProperty("benchPregen") ?: "0").toString()
			property "metalmc.lod", (project.findProperty("lod") ?: "0").toString()
			property "metalmc.lod.far", (project.findProperty("lodFar") ?: "2048").toString()
			property "metalmc.lod.extendFar", (project.findProperty("lodExtendFar") ?: "1").toString()
			property "metalmc.lod.live", (project.findProperty("lodLive") ?: "1").toString()
			property "metalmc.lod.textures", (project.findProperty("lodTextures") ?: "1").toString()
			property "metalmc.lod.generate", (project.findProperty("lodGenerate") ?: "1").toString()
			property "metalmc.tour", (project.findProperty("benchTour") ?: "0").toString()
			property "metalmc.fidelity", (project.findProperty("fidelity") ?: "0").toString()
			// -PfidelityTime=<ticks>: time of day for the fidelity tour (6000 noon, 13000 dusk, 18000 midnight).
			property "metalmc.fidelity.time", (project.findProperty("fidelityTime") ?: "6000").toString()
			property "metalmc.farProbe", (project.findProperty("farProbe") ?: "0").toString()
			property "metalmc.bench.extraWait", (project.findProperty("benchExtraWait") ?: "0").toString()
			property "metalmc.bench.fly", (project.findProperty("benchFly") ?: "0").toString()
			property "metalmc.bench.hitches", (project.findProperty("benchHitches") ?: "0").toString()
			if (project.hasProperty("submitsInFlight")) property "metalmc.submitsInFlight", project.findProperty("submitsInFlight").toString()
			if (project.hasProperty("benchNoLodWait")) property "metalmc.bench.noLodWait", project.findProperty("benchNoLodWait").toString()
			// Bench and fidelity runs keep TAA off unless asked (-Ptaa=true): the references were taken without it.
			property "metalmc.taa", (project.findProperty("taa") ?: "false").toString()
			property "metalmc.dumpMsl", (project.findProperty("dumpMsl") ?: "").toString()
			property "metalmc.backend.debug", (project.findProperty("metalDebug") ?: "0").toString()
			if (project.hasProperty("metalExp")) {
				environmentVariable "METALMC_EXP", project.findProperty("metalExp").toString()
			}
			// -Plod0=<blocks>: radius of the full-resolution LOD level around the player (0 turns it off).
			if (project.hasProperty("lod0")) {
				environmentVariable "METALMC_LOD0", project.findProperty("lod0").toString()
			}
			if (project.hasProperty("fade")) {
				environmentVariable "METALMC_FADE", project.findProperty("fade").toString()
			}
			if (project.hasProperty("taaBlend")) {
				environmentVariable "METALMC_TAABLEND", project.findProperty("taaBlend").toString()
			}
			if (project.hasProperty("waterGain")) {
				environmentVariable "METALMC_WATERGAIN", project.findProperty("waterGain").toString()
			}
			if (project.hasProperty("grassGain")) {
				environmentVariable "METALMC_GRASSGAIN", project.findProperty("grassGain").toString()
			}
			if (project.hasProperty("waterAlpha")) {
				environmentVariable "METALMC_WATERALPHA", project.findProperty("waterAlpha").toString()
			}
			if (project.hasProperty("transparentShade")) {
				environmentVariable "METALMC_TRANSPARENTSHADE", project.findProperty("transparentShade").toString()
			}
			if (project.hasProperty("ffWidth")) {
				environmentVariable "METALMC_FFWIDTH", project.findProperty("ffWidth").toString()
			}
			if (project.hasProperty("farField")) {
				environmentVariable "METALMC_FARFIELD", project.findProperty("farField").toString()
			}
			if (project.hasProperty("ffGain")) {
				environmentVariable "METALMC_FFGAIN", project.findProperty("ffGain").toString()
			}
			if (project.hasProperty("shadowScale")) {
				environmentVariable "METALMC_SHADOWSCALE", project.findProperty("shadowScale").toString()
			}
			// Sky and HDR (-PmetalExp=sky and/or hdr): -PskyExposure=<sun illuminance, default 12>, -PskyHaze=<distance
			// scale for aerial perspective, default 1>, -PsunSize=<disk radius in degrees, default 0.6>,
			// -PhdrSpace=srgb|p3 (default srgb, today's primaries), -PhdrPeak=<most headroom the tone curve uses>.
			if (project.hasProperty("skyExposure")) {
				environmentVariable "METALMC_SKYEXPOSURE", project.findProperty("skyExposure").toString()
			}
			if (project.hasProperty("skyHaze")) {
				environmentVariable "METALMC_SKYHAZE", project.findProperty("skyHaze").toString()
			}
			if (project.hasProperty("sunSize")) {
				environmentVariable "METALMC_SUNSIZE", project.findProperty("sunSize").toString()
			}
			if (project.hasProperty("hdrSpace")) {
				environmentVariable "METALMC_HDRSPACE", project.findProperty("hdrSpace").toString()
			}
			if (project.hasProperty("hdrPeak")) {
				environmentVariable "METALMC_HDRPEAK", project.findProperty("hdrPeak").toString()
			}
			if (project.hasProperty("visBias")) {
				environmentVariable "METALMC_VISBIAS", project.findProperty("visBias").toString()
			}
			if (project.hasProperty("dumpQuads")) {
				environmentVariable "METALMC_DUMPQUADS", project.findProperty("dumpQuads").toString()
			}
			if (project.hasProperty("farMin")) {
				environmentVariable "METALMC_FARMIN", project.findProperty("farMin").toString()
			}
			if (project.hasProperty("lodSplit")) {
				environmentVariable "METALMC_SPLIT", project.findProperty("lodSplit").toString()
			}
			if (project.hasProperty("lodQos")) {
				environmentVariable "METALMC_LODQOS", project.findProperty("lodQos").toString()
			}
			if (project.hasProperty("meshQuads")) {
				environmentVariable "METALMC_MESHQUADS", project.findProperty("meshQuads").toString()
			}
			if (project.hasProperty("tileSplit")) {
				environmentVariable "METALMC_TILESPLIT", project.findProperty("tileSplit").toString()
			}
			// Smart LOD (-PmetalExp=smartlod): -PlodErr=<pixels> splits tiles whose projected error is over it,
			// -PlodBudget=<quads> caps the quads the view counts (LodSmart.swift).
			if (project.hasProperty("lodErr")) {
				environmentVariable "METALMC_LODERR", project.findProperty("lodErr").toString()
			}
			if (project.hasProperty("lodBudget")) {
				environmentVariable "METALMC_LODBUDGET", project.findProperty("lodBudget").toString()
			}
			// Lit mode (-PmetalExp=lit,...): -PlitExposure=<scale, default 1> for the new light, -PlitView=<1-7> for a debug
			// view of the G-buffer and the light (Lit.swift: 1 albedo, 2 face, 3 light levels, 4 AO, 5 light, 6 sun
			// visibility, 7 the overlay test).
			if (project.hasProperty("litExposure")) {
				environmentVariable "METALMC_LITEXPOSURE", project.findProperty("litExposure").toString()
			}
			if (project.hasProperty("litView")) {
				environmentVariable "METALMC_LITVIEW", project.findProperty("litView").toString()
			}
			if (project.hasProperty("metalValidation")) {
				environmentVariable "MTL_DEBUG_LAYER", "1"
				environmentVariable "MTL_DEBUG_LAYER_ERROR_MODE", "nslog"
				environmentVariable "MTL_DEBUG_LAYER_WARNING_MODE", "nslog"
			}
			if (project.hasProperty("benchPregen")) {
				vmArg "-Xmx6G"
			}
			if (project.hasProperty("jfr")) {
				// CPU profile of the timed part of the run: warm-up is 20 s, so start at 30 s and record 30 s.
				vmArg "-XX:StartFlightRecording=" + (project.findProperty("jfrOpts") ?: "delay=30s,duration=30s") + ",settings=" + (project.findProperty("jfrSettings") ?: "profile") + ",filename=" + project.findProperty("jfr").toString()
			}
			// Generational ZGC (sub-millisecond pauses) by default; -Pgc=g1 for the launcher's default. G1's
			// 5-10 ms young collections every 2-3 s while chunks stream in were most of the frames that missed
			// 120 Hz in a 20 blocks/s flight (25 per minute with G1, 9 with ZGC).
			if ((project.findProperty("gc") ?: "zgc").toString() == "zgc") {
				vmArg "-XX:+UseZGC"
			}
			vmArg "--enable-native-access=ALL-UNNAMED"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// The Swift half of the backend (Sources/MetalMCNative), built with SwiftPM and bundled in the jar.
tasks.register('buildNative', Exec) {
	workingDir = file('..')
	commandLine 'swift', 'build', '-c', 'release', '--product', 'MetalMCNative'
}

processClientResources {
	dependsOn 'buildNative'
	from(file('../.build/release/libMetalMCNative.dylib')) {
		into 'natives/macos-arm64'
	}
}
